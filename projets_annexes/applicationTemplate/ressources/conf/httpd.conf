LoadModule mod_ibm_lwi /QSYS.LIB/QHTTPSVR.LIB/QLWIIHSMOD.SRVPGM
# Activer les modules proxy (si pas déjà fait)
LoadModule proxy_module /QSYS.LIB/QHTTPSVR.LIB/QZSRCORE.SRVPGM
LoadModule proxy_http_module /QSYS.LIB/QHTTPSVR.LIB/QZSRCORE.SRVPGM
# Proxy pour l'API Node.js (port 44000)
ProxyPass /api http://localhost:44000/api
ProxyPassReverse /api http://localhost:44000/api
# Timeout pour les requêtes longues (optionnel)
ProxyTimeout 300

# Headers pour préserver les informations originales
ProxyPreserveHost On

HotBackup Off
KeepAlive Off
DocumentRoot /www/WSERVICE2/htdocs
<Directory /www/WSERVICE2/htdocs/react-admin>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    
    # Réécriture d'URL pour React Router
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /react-admin
        
        # Ne pas réécrire les fichiers qui existent
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        
        # Ne pas réécrire les appels API
        RewriteCond %{REQUEST_URI} !^/api
        
        # Rediriger tout le reste vers index.html
        RewriteRule . /react-admin/index.html [L]
    </IfModule>
</Directory>

# Configuration du répertoire htdocs principal (garde vos apps existantes)
<Directory /www/WSERVICE2/htdocs>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

AddLanguage en .en
LogMaint logs/error_log 7 0
LogFormat "%h %T %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
Listen *:10074
TraceEnable On
AccessFileName .htaccess
DirectoryIndex index.html
<Location />
  Require all granted
</Location>
LoadModule was_ap20_module /QSYS.LIB/QHTTPSVR.LIB/QSVTAP24.SRVPGM
WebSpherePluginConfig /www/WSERVICE2/conf/ias-plugin-cfg.xml
<LwiProfile WSERVICE2>
  LwiAssignUserID QWSERVICE
  LwiAutostartOption StartEnd
  LwiStartJobQueue QHTTPSVR/QZHBHTTP HTTPWWW
</LwiProfile>
